name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;21.2.6472646'

      - name: Check module consistency
        run: |
          chmod +x build.sh
          ./build.sh --check

      - name: Build module zip
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/21.2.6472646
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: dist/*.zip
          if-no-files-found: error
